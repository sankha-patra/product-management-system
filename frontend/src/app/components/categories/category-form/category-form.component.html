<h2 mat-dialog-title class="gradient-text">{{ data ? 'Edit' : 'Add' }} Category</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Category Name</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button class="gradient-button" [disabled]="form.invalid" (click)="onSubmit()">
    Save
  </button>
</mat-dialog-actions
