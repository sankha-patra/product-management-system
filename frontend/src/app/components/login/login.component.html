<div class="auth-container">
  <mat-card class="glass-card animate-fade-in auth-card">
    <mat-card-header>
      <mat-card-title class="gradient-text">Welcome Back</mat-card-title>
      <mat-card-subtitle>Login to your account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email">
        </mat-form-field>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password">
        </mat-form-field>
        <button mat-raised-button class="gradient-button full-width" type="submit" [disabled]="loginForm.invalid">
          Login
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions class="auth-actions">
      <span class="text-secondary">Don't have an account? <a routerLink="/register">Register</a></span>
    </mat-card-actions>
  </mat-card>
</div>
