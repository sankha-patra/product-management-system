<div class="header-actions">
  <h2 class="gradient-text">Products</h2>
  <div class="action-buttons">
    <button mat-stroked-button (click)="downloadReport('csv')">CSV Report</button>
    <button mat-stroked-button (click)="downloadReport('xlsx')">Excel Report</button>
    <button mat-raised-button class="gradient-button" (click)="openDialog()">
      <mat-icon>add</mat-icon> Add Product
    </button>
  </div>
</div>

<div class="filters glass-card">
  <mat-form-field appearance="fill">
    <mat-label>Search Products</mat-label>
    <input matInput [(ngModel)]="search" (keyup.enter)="onSearchChange()">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Filter by Category</mat-label>
    <mat-select [(ngModel)]="categoryId" (selectionChange)="onCategoryFilterChange()">
      <mat-option value="">All Categories</mat-option>
      <mat-option *ngFor="let cat of categories" [value]="cat.id">{{cat.name}}</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div class="glass-card table-container">
  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="mat-elevation-z8">
    
    <ng-container matColumnDef="image">
      <th mat-header-cell *matHeaderCellDef> Image </th>
      <td mat-cell *matCellDef="let element">
        <img [src]="element.image || 'assets/placeholder.png'" alt="product" class="product-thumb">
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="categoryName">
      <th mat-header-cell *matHeaderCellDef> Category </th>
      <td mat-cell *matCellDef="let element"> {{element.categoryName}} </td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Price </th>
      <td mat-cell *matCellDef="let element"> \${{element.price}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="openDialog(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteProduct(element.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="totalElements"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="[5, 10, 25, 100]"
                 (page)="onPageChange($event)">
  </mat-paginator>
</div>
